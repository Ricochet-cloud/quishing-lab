
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대학생 AI 사용 실태 조사</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f4f6fa;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 500px;
    margin: 40px auto;
    padding: 24px;
    background: white;
    border-radius: 14px;
}

h1 {
    font-size: 23px;
    color: #2457a7;
}

p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
}

label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2457a7;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.notice {
    background: #eef4ff;
    padding: 12px;
    border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">

<h1>대학생 AI 사용 실태 조사</h1>

<p class="notice">
교육용 보안 실습을 위한 가상 설문조사입니다.
실제 개인정보는 입력하지 마세요.
</p>

<p>대학생의 생성형 AI 활용 현황을 조사합니다.</p>

<form action="/submit" method="POST">

<label>테스트 이름</label>
<input name="name" placeholder="test_user_01" required>

<label>학과</label>
<select name="major" required>
<option value="">선택해주세요</option>
<option>정보보안</option>
<option>컴퓨터공학</option>
<option>인공지능</option>
<option>기타</option>
</select>

<label>AI 사용 빈도</label>
<select name="ai_usage" required>
<option value="">선택해주세요</option>
<option>매일</option>
<option>주 3~4회</option>
<option>주 1~2회</option>
<option>거의 사용하지 않음</option>
</select>

<button type="submit">설문 제출</button>

</form>

</div>
</body>
</html>
